<style>
  :root{
    --bg-peach:#f0fdf6;
    --bg-lavender:#e9fcf1;
    --bg-pink:#f2fdf8;
    --bg-base:#ffffff;
    --ink:#020a06;
    --ink-soft:#5c6b62;
    --ink-faint:#9aabab;
    --card-bg:#ffffffee;
    --card-border:#d7f0e0;
    --divider:#e0f5e8;
    --input-bg:#ffffff;
    --input-border:#d7f0e0;
    --input-border-focus:#00e676;
    --pill-a:#00e676;
    --pill-b:#a3ff5f;
    --chip-track-bg:#eafcf1;
    --chip-active-bg:#ffffff;
    --month-btn-bg:#eafcf1;
    --month-btn-bg-hover:#d7f5e2;
    --green:#00c853;
    --green-bg:#e3f9ec;
    --red:#e53935;
    --red-bg:#fdeceb;
    --missed-border:#f3c6c3;
    --cell-bg:#ffffff;
    --cell-border:#d9ede1;
    --future-bg:#f6fdf9;
    --future-border:#eaf7ef;
    --flame:#ffb300;
    --shadow: 0 2px 12px rgba(11,61,46,0.07);
    --accent-line:#a3ff5f;
    --dashed-border:#bdeecb;
    --stat-border:#e6f7ec;
    --rm-color:#b8ccc0;
    --axis-line:#cdeada;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:8px;
    --serif: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  body.dark{
    --bg-peach:#0d1f17;
    --bg-lavender:#020a06;
    --bg-pink:#0f1c15;
    --bg-base:#020a06;
    --ink:#ffffff;
    --ink-soft:#8fae9d;
    --ink-faint:#4f6459;
    --card-bg:rgba(0,230,118,0.045);
    --card-border:rgba(0,230,118,0.16);
    --divider:rgba(0,230,118,0.12);
    --input-bg:rgba(0,230,118,0.05);
    --input-border:rgba(0,230,118,0.20);
    --input-border-focus:#00e676;
    --pill-a:#00e676;
    --pill-b:#a3ff5f;
    --chip-track-bg:rgba(0,230,118,0.07);
    --chip-active-bg:rgba(0,230,118,0.16);
    --month-btn-bg:rgba(0,230,118,0.08);
    --month-btn-bg-hover:rgba(0,230,118,0.16);
    --green:#00e676;
    --green-bg:rgba(0,230,118,0.16);
    --red:#ff5252;
    --red-bg:rgba(255,82,82,0.16);
    --missed-border:rgba(255,82,82,0.35);
    --cell-bg:rgba(0,230,118,0.03);
    --cell-border:rgba(0,230,118,0.14);
    --future-bg:rgba(255,255,255,0.02);
    --future-border:rgba(0,230,118,0.06);
    --flame:#ffc107;
    --shadow:0 2px 16px rgba(0,0,0,0.55);
    --accent-line:#00e676;
    --dashed-border:rgba(0,230,118,0.22);
    --stat-border:rgba(0,230,118,0.10);
    --rm-color:rgba(255,255,255,0.25);
    --axis-line:rgba(0,230,118,0.28);
  }
  *{box-sizing:border-box;}
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(120% 70% at 50% 118%, #020a06 0 46%, transparent 46.4%),
      radial-gradient(130% 80% at 50% 124%, #a3ff5f 0 47.2%, transparent 47.6%),
      radial-gradient(150% 95% at 50% 128%, #00c853 0 52%, transparent 70%),
      radial-gradient(60% 40% at 8% 30%, rgba(0,200,100,0.30), transparent 70%),
      radial-gradient(40% 40% at 100% 60%, rgba(120,255,80,0.18), transparent 70%),
      #020a06;
    opacity:.9;filter:blur(.4px);
  }
  body:not(.dark)::before{opacity:.18;}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 10% -10%, var(--bg-peach), transparent 60%),
      radial-gradient(1200px 500px at 50% -20%, var(--bg-lavender), transparent 60%),
      radial-gradient(1200px 500px at 90% -10%, var(--bg-pink), transparent 60%),
      var(--bg-base);
    min-height:100vh;
    padding:20px 20px 60px;
    transition:background-color .25s ease, color .25s ease;
  }
  .app{max-width:1180px;margin:0 auto;}

  .top-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;}
  .theme-toggle, .notify-toggle, .logout-btn{
    border:1px solid var(--card-border);background:var(--card-bg);color:var(--ink);
    padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;
  }
  .settings-page{max-width:460px;margin:6px auto 0;display:flex;flex-direction:column;gap:18px;}
  .settings-page h1{font-family:var(--serif);font-size:24px;margin:0 0 2px;}

  .settings-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;}
  .settings-card.pad{padding:18px 18px 16px;}

  .account-row{display:flex;align-items:center;gap:13px;padding:18px 18px 14px;}
  .account-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pill-a),var(--pill-b));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .account-info{min-width:0;}
  .account-email{font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .account-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}

  .settings-divider{height:1px;background:var(--divider);margin:0 18px;}

  .plan-row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:13.5px;color:var(--ink);}
  .plan-badge{background:var(--chip-track-bg);border:1px solid var(--card-border);color:var(--ink-soft);font-size:11.5px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;padding:4px 11px;border-radius:999px;}

  .upgrade-btn{
    display:block;width:calc(100% - 28px);margin:2px 14px 14px;padding:11px;border:none;border-radius:var(--radius-sm);
    background:linear-gradient(90deg,var(--pill-a),var(--pill-b));color:#07250f;font-weight:700;font-size:13.5px;
    cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }

  .settings-item{
    display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;background:none;border:none;
    border-bottom:1px solid var(--divider);text-align:left;font-size:14px;color:var(--ink);cursor:pointer;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:var(--sans);
  }
  .settings-item:last-child{border-bottom:none;}
  .settings-item .si-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0;}
  .settings-item .si-label{flex:1;}
  .settings-item .si-chev{color:var(--ink-faint);font-size:16px;}
  .settings-item.danger{color:var(--red);}
  .settings-item.danger .si-icon{filter:none;}

  .settings-modal-overlay{position:fixed;inset:0;background:rgba(10,20,15,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:90;}
  @media (min-width:560px){ .settings-modal-overlay{align-items:center;padding:20px;} }
  .settings-modal-card{
    background:var(--bg-base);width:100%;max-width:460px;max-height:min(78vh,620px);overflow-y:auto;
    border-radius:20px 20px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -10px 40px rgba(0,0,0,0.3);
  }
  @media (min-width:560px){ .settings-modal-card{border-radius:var(--radius-lg);} }
  .settings-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .settings-modal-head h2{font-family:var(--serif);font-size:19px;margin:0;}
  .settings-modal-close{border:none;background:var(--chip-track-bg);color:var(--ink-soft);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;}
  .settings-modal-card p{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin:0 0 12px;}
  .faq-item{margin-bottom:14px;}
  .faq-item .q{font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:3px;}
  .faq-item .a{font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .notice-item{padding:10px 0;border-bottom:1px solid var(--divider);}
  .notice-item:last-child{border-bottom:none;}
  .notice-item .n-date{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:3px;}
  .notice-item .n-title{font-size:13.5px;font-weight:600;color:var(--ink);}
  .settings-modal-card textarea{
    width:100%;min-height:110px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--ink);
    border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--sans);font-size:13.5px;resize:vertical;margin-bottom:12px;
  }
  .settings-modal-card input[type="password"]{
    width:100%;border:1px solid var(--input-border);background:var(--input-bg);color:var(--ink);
    border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--sans);font-size:13.5px;margin-bottom:10px;
  }
  .settings-modal-card .primary-btn{
    border:none;border-radius:var(--radius-sm);background:var(--green);color:#fff;font-weight:600;
    font-size:13.5px;padding:10px 16px;cursor:pointer;touch-action:manipulation;
  }
  .settings-modal-note{font-size:12px;color:var(--ink-faint);margin-top:8px;}

  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;justify-content:space-around;align-items:stretch;
    background:#15171c;border-top:1px solid rgba(255,255,255,0.06);
    box-shadow:0 -6px 24px rgba(0,0,0,0.25);
    padding-bottom:env(safe-area-inset-bottom,0px);

  .bottom-nav button{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;padding:11px 4px 10px;margin:0;background:none;border:none;
    appearance:none;-webkit-appearance:none;outline:none;
    cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;
    color:#767f8c;font-size:11px;font-weight:500;font-family:var(--sans);letter-spacing:0.01em;
    position:relative;transition:color .15s ease;

  .bottom-nav button::before{
    content:'';position:absolute;top:0;left:50%;width:22px;height:2.5px;border-radius:0 0 3px 3px;
    background:var(--pill-a);transform:translateX(-50%) scaleX(0);transition:transform .18s ease;
  }
  .bottom-nav button.active::before{transform:translateX(-50%) scaleX(1);}
  .bottom-nav button .bn-icon{font-size:20px;line-height:1;opacity:0.55;transition:opacity .15s ease,transform .15s ease;}
  .bottom-nav button.active{color:#ffffff;}
  .bottom-nav button.active .bn-icon{opacity:1;transform:translateY(-1px);}
  .bn-icon svg{width:22px;height:22px;display:block;overflow:visible;}
  .bn-icon svg .f{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .bn-icon svg .c{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .bn-icon svg .ln{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;}
  .bn-icon svg .hole{fill:none;stroke:currentColor;stroke-width:1.6;}
  .bn-icon svg.snow{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .bottom-nav button.active .bn-icon svg .f{fill:currentColor;stroke:none;}
  .bottom-nav button.active .bn-icon svg .c{stroke:#15171c;}
  .bottom-nav button.active .bn-icon svg .hole{fill:#15171c;stroke:none;}
  .bottom-nav button.active .bn-icon svg.snow{stroke-width:2.1;}
  .bottom-nav button:active .bn-icon{transform:scale(0.9);}
  body{padding-bottom:88px;}

  /* ---------- WINTER ARC ---------- */
  .section-nav{margin-bottom:16px;}

  .wa-note{font-size:12.5px;color:var(--ink-soft);background:var(--card-bg);border-left:3px solid #38bdf8;padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:18px;}

  .wa-setup-card textarea{

    border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--sans);font-size:13.5px;resize:vertical;margin-bottom:16px;
  }
  .wa-setup-card select{
    width:100%;border:1px solid var(--input-border);background:var(--input-bg);color:var(--ink);

  }
  .wa-generate-btn{width:100%;display:block;border:none;border-radius:var(--radius-sm);background:linear-gradient(90deg,#38bdf8,#818cf8);color:#071326;font-weight:700;font-size:14px;padding:13px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:var(--sans);}

  /* ---------- REMINDER FEATURE (Samsung / One UI Mint-Green Design System) ---------- */
  :root {
    --rm-mint-radial: radial-gradient(circle at 50% 25%, #eaf9f0 0%, #d6f4e4 60%, #c4edd6 100%);
    --rm-card-bg: #ffffff;
    --rm-card-radius: 18px;
    --rm-card-shadow: 0 2px 10px rgba(0, 0, 0, 0.035), 0 1px 3px rgba(0, 0, 0, 0.02);
    --rm-text-main: #111827;
    --rm-text-muted: #6b7280;
    --rm-text-sub: #9ca3af;
    --rm-amber: #d97706;
    --rm-star: #eab308;
    --rm-blue: #3b82f6;
    --rm-coral: #ef4444;
    --rm-cyan: #06b6d4;
    --rm-purple: #a855f7;
    --rm-green: #10b981;
  }

  .reminder-container {
    background: var(--rm-mint-radial);
    min-height: calc(100vh - 120px);
    padding: 20px 16px 120px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--rm-text-main);
    box-sizing: border-box;
    position: relative;
    max-width: 680px;
    margin: 0 auto;
    border-radius: 20px;
  }

  /* Top Navigation Bar */
  .rm-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 4px 18px;
  }
  .rm-top-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .rm-topbar h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0;
    color: #111827;
    letter-spacing: -0.4px;
  }
  .rm-back-btn, .rm-icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    color: #1f2937;
    transition: background 0.15s ease;
    padding: 0;
  }
  .rm-back-btn:hover, .rm-icon-btn:hover {
    background: rgba(0, 0, 0, 0.06);
  }
  .rm-top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
  }

  /* Search bar expansion */
  .rm-search-box {
    margin-bottom: 16px;
    background: #ffffff;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    padding: 8px 16px;
    box-shadow: var(--rm-card-shadow);
  }
  .rm-search-box input {
    border: none;
    outline: none;
    width: 100%;
    font-size: 14px;
    background: transparent;
    margin-left: 8px;
    color: #111827;
  }

  /* 6 Summary Category Cards */
  .rm-summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .rm-summary-card {
    background: var(--rm-card-bg);
    border-radius: 16px;
    padding: 12px 14px;
    box-shadow: var(--rm-card-shadow);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 72px;
    user-select: none;
  }
  .rm-summary-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
  }
  .rm-sum-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .rm-sum-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 16px;
  }
  .rm-sum-count {
    font-size: 19px;
    font-weight: 700;
    color: #111827;
  }
  .rm-sum-label {
    font-size: 12px;
    color: #4b5563;
    font-weight: 500;
    margin-top: 6px;
  }

  /* Section Headings */
  .rm-section-title {
    font-size: 13px;
    font-weight: 600;
    color: #4b5563;
    margin: 18px 0 8px 6px;
    letter-spacing: 0.2px;
  }

  /* Reminder Cards */
  .rm-card {
    background: var(--rm-card-bg);
    border-radius: var(--rm-card-radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--rm-card-shadow);
    transition: background 0.15s ease;
  }
  .rm-card-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .rm-circle-check {
    width: 22px;
    height: 22px;
    min-width: 22px;
    border-radius: 50%;
    border: 2px solid #cbd5e1;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    padding: 0;
    transition: all 0.15s ease;
  }
  .rm-circle-check:hover {
    border-color: #94a3b8;
  }
  .rm-circle-check.checked {
    background: #64748b;
    border-color: #64748b;
    color: #ffffff;
  }
  .rm-card-body {
    flex: 1;
  }
  .rm-card-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .rm-card-title {
    font-size: 15px;
    font-weight: 500;
    color: #111827;
    margin: 0;
    line-height: 1.35;
  }
  .rm-card-title.done {
    text-decoration: line-through;
    color: #9ca3af;
  }
  .rm-star-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    color: #d1d5db;
    padding: 2px;
    transition: transform 0.15s ease;
  }
  .rm-star-btn.active {
    color: var(--rm-star);
  }
  .rm-card-date {
    font-size: 12.5px;
    color: var(--rm-amber);
    margin-top: 4px;
    font-weight: 500;
  }
  .rm-card-date.muted {
    color: #9ca3af;
  }

  /* Nested Checklist */
  .rm-checklist {
    list-style: none;
    margin: 10px 0 4px 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .rm-checklist-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    color: #374151;
  }
  .rm-checklist-item.done {
    text-decoration: line-through;
    color: #9ca3af;
  }
  .rm-sub-check {
    width: 16px;
    height: 16px;
    min-width: 16px;
    border-radius: 50%;
    border: 1.5px solid #cbd5e1;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-size: 9px;
  }
  .rm-sub-check.checked {
    background: #64748b;
    border-color: #64748b;
    color: #ffffff;
  }

  /* Contact pill for completed calls */
  .rm-contact-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f1f5f9;
    padding: 4px 10px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    color: #1e293b;
    margin-top: 8px;
  }

  /* Empty state for Today */
  .rm-empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48vh;
    color: #374151;
    font-size: 18px;
    font-weight: 500;
    text-align: center;
  }

  /* Notification Permission & PWA Banner */
  .rm-notify-banner {
    background: linear-gradient(135deg, #eff6ff 0%, #ecfdf5 100%);
    border: 1px solid #bfdbfe;
    border-radius: 18px;
    padding: 12px 14px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 2px 10px rgba(37, 99, 235, 0.06);
  }
  body.dark .rm-notify-banner {
    background: linear-gradient(135deg, #1e293b 0%, #064e3b 100%);
    border-color: #334155;
    color: #f8fafc;
  }
  .rm-notify-banner-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .rm-notify-banner-icon {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 12px;
    background: #2563eb;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .rm-notify-banner-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .rm-notify-banner-title {
    font-size: 13.5px;
    font-weight: 700;
    color: #111827;
  }
  body.dark .rm-notify-banner-title {
    color: #f8fafc;
  }
  .rm-notify-banner-sub {
    font-size: 11.5px;
    color: #4b5563;
    line-height: 1.35;
  }
  body.dark .rm-notify-banner-sub {
    color: #cbd5e1;
  }
  .rm-notify-banner-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .rm-notify-btn-primary {
    border: none;
    background: #2563eb;
    color: #ffffff;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 9999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .rm-notify-btn-secondary {
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #1e293b;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 9999px;
    cursor: pointer;
    white-space: nowrap;

  body.dark .rm-notify-btn-secondary {
    background: #0f172a;
    border-color: #334155;
    color: #e2e8f0;

  .rm-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 9999px;
    border: 1px solid #bbf7d0;
    background: #f0fdf4;
    color: #15803d;
    cursor: pointer;
  }
  body.dark .rm-status-pill {
    background: #064e3b;
    border-color: #059669;
    color: #6ee7b7;
  }

  /* Live Due Reminder Alert Banner */
  .rm-live-alert-overlay {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 28px);
    max-width: 460px;
    background: #111827;
    color: #ffffff;
    border-radius: 20px;
    padding: 16px 18px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.12);
    z-index: 9999;
    animation: rmAlertSlideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes rmAlertSlideDown {
    from { opacity: 0; transform: translate(-50%, -20px) scale(0.96); }
    to { opacity: 1; transform: translate(-50%, 0) scale(1); }
  }
  @keyframes rmBellRing {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(15deg); }
    40% { transform: rotate(-15deg); }
    60% { transform: rotate(10deg); }
    80% { transform: rotate(-10deg); }
  }
  .rm-live-alert-bell {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: rgba(16, 185, 129, 0.2);
    color: #34d399;
    font-size: 20px;
    animation: rmBellRing 0.9s ease-in-out infinite;
  }
  .rm-live-alert-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }
  .rm-live-alert-btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;

  /* ---------- 6PM REMINDER ---------- */

  const WA_WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const WA_ACTION_TEMPLATES = [

  const WA_REST_TEMPLATES = [
    g => `Rest day \u2014 light reflection on "${g}"`,

  ];

  function waBuildPlan(goal, daysPerWeek){
    const g = String(goal || '').trim();
    const dpw = Math.min(7, Math.max(1, Number(daysPerWeek) || 5));
    const actionDays = WA_WEEKDAY_SPREAD.slice(0, dpw);
    const tasksByWeekday = {};
    WA_WEEKDAY_SPREAD.forEach((wd, idx) => {
      if(actionDays.includes(wd)){
        const t1 = WA_ACTION_TEMPLATES[idx % WA_ACTION_TEMPLATES.length](g);
        const t2 = WA_ACTION_TEMPLATES[(idx + 3) % WA_ACTION_TEMPLATES.length](g);
        tasksByWeekday[wd] = (idx % 2 === 0) ? [t1, t2] : [t1];
      } else {
        tasksByWeekday[wd] = [WA_REST_TEMPLATES[wd % WA_REST_TEMPLATES.length](g)];
      }
    });
    return {
      goal: g,
      daysPerWeek: dpw,
      firstTask: `Take the smallest next step toward: ${g}`,

  async function waGenerateAIPlan(goal, dpw){

    const { data: sessionData } = await sb.auth.getSession();
    const token = sessionData && sessionData.session && sessionData.session.access_token;

      method:'POST',
      headers:{
        'content-type':'application/json',
        'authorization': `Bearer ${token}`,
        'apikey': SUPABASE_ANON_KEY

      body: JSON.stringify({ goal, daysPerWeek: dpw })
    });
    const payload = await res.json().catch(() => null);
    if(!res.ok){
      throw new Error((payload && payload.error) || `Plan service error ${res.status}`);

    if(!payload || !payload.firstTask || !Array.isArray(payload.phases) || !payload.tasksByWeekday || !payload.notes){

  async function fetchAdminUsers(forceFresh){
    if(isFetchingAdminUsers && !forceFresh && cachedAdminUsers.length) return cachedAdminUsers;
    isFetchingAdminUsers = true;

    let remoteUsers = [];
    if(sb){
      try {
        const { data: ru, error } = await sb.rpc('get_admin_dashboard_users');
        if(!error && Array.isArray(ru) && ru.length > 0){
          remoteUsers = ru;
        }
      } catch(e){
        console.warn('RPC notice:', e);
      }

      try {
        const { data: profs, error: pe } = await sb.from('admin_user_profiles').select('*');
        if(!pe && Array.isArray(profs)){
          profs.forEach(p => {
            const em = (p.email || '').toLowerCase().trim();
            if(!em) return;
            const existing = remoteUsers.find(r => (r.email || '').toLowerCase().trim() === em);
            if(!existing){
              remoteUsers.push({
                email: em,
                tier: p.tier || 'free',
                created_at: p.updated_at || new Date().toISOString(),
                habits_count: p.habits_count || 0,
                tasks_count: p.tasks_count || 0
              });
            } else {
              if(p.tier) existing.tier = p.tier;
              if(typeof p.habits_count === 'number' && p.habits_count > 0) existing.habits_count = p.habits_count;
              if(typeof p.tasks_count === 'number' && p.tasks_count > 0) existing.tasks_count = p.tasks_count;
            }
          });
        }
      } catch(e){
        console.warn('Profiles table notice:', e);
      }
    }

    const localUsers = getLocalUsers();
    const map = new Map();

    // 1. Add remote users
    remoteUsers.forEach(u => {
      const em = (u.email || '').toLowerCase().trim();
      if(em){
        map.set(em, {
          email: em,
          tier: u.tier || (em === 'saurabh.7409019134@gmail.com' ? 'max' : 'free'),
          createdAt: u.created_at || new Date().toISOString(),
          habitsCount: u.habits_count || 0,
          tasksCount: u.tasks_count || 0
        });
      }
    });

    // 2. Add local users
    Object.keys(localUsers).forEach(em => {
      const norm = em.toLowerCase().trim();
      const lu = localUsers[em];
      if(!map.has(norm)){
        map.set(norm, {
          email: norm,
          tier: lu.plan || 'free',
          createdAt: lu.createdAt || lu.updatedAt || new Date().toISOString(),
          habitsCount: lu.habitsCount || 0,
          tasksCount: lu.tasksCount || 0
        });
      } else {
        const existing = map.get(norm);
        if(lu.plan) existing.tier = lu.plan;
        if(lu.habitsCount) existing.habitsCount = lu.habitsCount;
        if(lu.tasksCount) existing.tasksCount = lu.tasksCount;
      }
    });

    // 3. Ensure Saurabh (admin) is always present
    const adminEmail = 'saurabh.7409019134@gmail.com';
    if(!map.has(adminEmail)){
      map.set(adminEmail, {
        email: adminEmail,
        tier: data.plan || 'max',
        createdAt: '2026-10-15T03:38:38Z',
        habitsCount: data.habits ? data.habits.length : 0,
        tasksCount: data.toDoList ? data.toDoList.filter(Boolean).length : 0
      });
    } else {
      const adm = map.get(adminEmail);
      if(currentUserEmail && currentUserEmail.toLowerCase() === adminEmail){
        adm.habitsCount = data.habits ? data.habits.length : adm.habitsCount;
        adm.tasksCount = data.toDoList ? data.toDoList.filter(Boolean).length : adm.tasksCount;
        adm.tier = data.plan || adm.tier;
      }
    }

    cachedAdminUsers = Array.from(map.values()).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    isFetchingAdminUsers = false;
    return cachedAdminUsers;
  }

  async function loadData(){
    let d = null;
    try {
      if(currentUserId){
        const raw = localStorage.getItem('habit_data_' + currentUserId);
        if(raw) d = Object.assign(defaultData(), JSON.parse(raw));
      }
    } catch(e){}

    try {
      if(sb && currentUserId){
        const { data: row, error } = await sb.from('tracker_data').select('data').eq('user_id', currentUserId).maybeSingle();
        if(!error && row && row.data){
          d = Object.assign(defaultData(), row.data);
          try { localStorage.setItem('habit_data_' + currentUserId, JSON.stringify(d)); } catch(e){}
        }
      }
    } catch(e){}

    if(!d) d = defaultData();

    let migrated = false;
    if(d.dailyRoutine){
      delete d.dailyRoutine;
      migrated = true;
    }
    try {
      Object.keys(localStorage).forEach(k => {
        if(k.startsWith('habit_dr_') || k.startsWith('dr_')) localStorage.removeItem(k);
      });
    } catch(e){}
    (d.habits || []).forEach(h => {
      if(!h.emoji){ h.emoji = suggestEmoji(h.name); migrated = true; }
    });
    if(migrated){ data = d; scheduleSave(); }
    return d;
  }
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      if(!currentUserId) { console.warn('Not signed in — changes are not being saved.'); return; }
      try {
        localStorage.setItem('habit_data_' + currentUserId, JSON.stringify(data));
      } catch(e){
        console.error('Could not save to localStorage', e);
      }
      if(sb){
        try{
          await sb.from('tracker_data').upsert(
            { user_id: currentUserId, data: data, updated_at: new Date().toISOString() },
            { onConflict: 'user_id' }
          );
        } catch(e){
          console.warn('Remote sync notice:', e && e.message);
        }
        if(currentUserEmail){
          try{
            await sb.from('admin_user_profiles').upsert({
              email: currentUserEmail.toLowerCase(),
              tier: data.plan || 'free',
              habits_count: (data.habits || []).length,
              tasks_count: (data.toDoList ? data.toDoList.filter(Boolean).length : 0),
              updated_at: new Date().toISOString()
            }, { onConflict: 'email' });
          } catch(e){}
        }
      }
    }, 250);
  }

  const statusKey = (habitId, date) => habitId + '::' + dateKey(date);
  function effectiveStatus(habitId, date){
    const stored = data.statuses[statusKey(habitId,date)];
    if(stored === 'done') return 'done';
    const today = startOfDay(new Date());
    const d = startOfDay(date);
    if(d.getTime() > today.getTime()) return 'future';
    if(d.getTime() < today.getTime()) return 'missed';
    return 'pending';
  }
  function toggleStatus(habitId, date){
    const eff = effectiveStatus(habitId, date);
    if(eff === 'future') return;
    const key = statusKey(habitId, date);
    if(eff === 'done') delete data.statuses[key];
    else data.statuses[key] = 'done';
    scheduleSave();
  }
  function dayCompletionPct(date){
    if(data.habits.length === 0) return null;
    const today = startOfDay(new Date());
    if(startOfDay(date).getTime() > today.getTime()) return null;
    let done = 0;
    data.habits.forEach(h => { if(effectiveStatus(h.id, date) === 'done') done++; });
    return (done / data.habits.length) * 100;
  }
  function computeStreaks(){
    const created = startOfDay(new Date(data.createdAt));
    const today = startOfDay(new Date());
    let best = 0, running = 0;
    let cursor = new Date(created);
    while(cursor.getTime() <= today.getTime()){
      const pct = dayCompletionPct(cursor);
      if(pct !== null){
        if(pct >= 70){ running++; if(running > best) best = running; }
        else running = 0;
      }
      cursor = addDays(cursor, 1);
    }
    let current = 0;
    let d = new Date(today);
    while(d.getTime() >= created.getTime()){
      const pct = dayCompletionPct(d);
      if(pct === null){ d = addDays(d,-1); continue; }
      if(pct >= 70){ current++; d = addDays(d,-1); }
      else break;
    }
    return { current, best: Math.max(best, current) };
  }

  // ---------- winter arc: 90-day tracker logic ----------
  function waIso(d){ return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
  function waTodayIso(){ const n=new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); }
  function waMs(s){ const p=s.split("-"); return Date.UTC(+p[0],+p[1]-1,+p[2]); }
  function waDateOf(i){ return new Date(waMs(data.winterArc.startDate) + i*864e5); }
  function waListFor(i){
    const plan = data.winterArc.plan;
    if(!plan) return [];
    return [plan.firstTask].concat(plan.tasksByWeekday[waDateOf(i).getUTCDay()] || []);
  }
  function waTicks(i){
    const n = waListFor(i).length;
    const a = data.winterArc.done['d'+i] || [];
    const r = [];
    for(let k=0;k<n;k++) r.push(!!a[k]);
    return r;
  }
  function waComplete(i){ return waTicks(i).every(Boolean); }
  function waTodayIdx(){ return Math.floor((waMs(waTodayIso()) - waMs(data.winterArc.startDate)) / 864e5); }
  function waToggleTask(dayIdx, taskIdx){
    const a = waTicks(dayIdx);
    a[taskIdx] = !a[taskIdx];
    data.winterArc.done['d'+dayIdx] = a;
    scheduleSave();
  }

  // ---------- Notification Sound (seven_am_sunlight.mp4) & 5m-Ring / 5m-Break / 5m-Ring Cycle ----------
  const NOTIFICATION_SOUND_SRC = './seven_am_sunlight.mp4';
  const NOTIFICATION_RING_DURATION_MS = 5 * 60 * 1000;  // 5 minutes of continuous repeat
  const NOTIFICATION_BREAK_DURATION_MS = 5 * 60 * 1000; // 5 minutes of break before resuming

  let audioCtx = null;
  let beepIntervalId = null;
  let notificationAudioEl = null;
  let notificationAudioBuffer = null;
  let notificationBufferLoading = false;
  let notificationBufferSource = null;
  let notificationBufferGain = null;
  let notificationPreviewTimeout = null;
  let isNotificationSoundLooping = false;

  function ensureAudioCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ /* unsupported */ }
    } else if(audioCtx.state === 'suspended'){
      audioCtx.resume().catch(() => {});
    }
  }

  function ensureNotificationAudioElement(){
    if(!notificationAudioEl && typeof Audio !== 'undefined'){
      try {
        notificationAudioEl = new Audio(NOTIFICATION_SOUND_SRC);
        notificationAudioEl.preload = 'auto';
        notificationAudioEl.loop = true;
        notificationAudioEl.playsInline = true;
      } catch(e){}
    }
    return notificationAudioEl;
  }

  function preloadNotificationAudioBuffer(){
    if(notificationAudioBuffer || notificationBufferLoading) return;
    notificationBufferLoading = true;
    fetch(NOTIFICATION_SOUND_SRC)
      .then(res => res.ok ? res.arrayBuffer() : Promise.reject(new Error('load failed')))
      .then(buf => {
        ensureAudioCtx();
        if(!audioCtx) return null;
        return new Promise((resolve, reject) => {
          audioCtx.decodeAudioData(buf, resolve, reject);
        });
      })
      .then(decoded => {
        if(decoded) notificationAudioBuffer = decoded;
      })
      .catch(() => {})
      .finally(() => {
        notificationBufferLoading = false;
      });
  }

  // Unlock audio playback on first user gesture so scheduled reminders can play seven_am_sunlight.mp4 freely
  function unlockNotificationAudioOnGesture(){
    ensureAudioCtx();
    ensureNotificationAudioElement();
    preloadNotificationAudioBuffer();
  }
  document.addEventListener('pointerdown', unlockNotificationAudioOnGesture, { once: true, passive: true });
  document.addEventListener('keydown', unlockNotificationAudioOnGesture, { once: true, passive: true });

  function getVolumeForSoundLevel(soundLevel){
    const level = soundLevel || 'Strong';
    if(level === 'Silent') return 0;
    if(level === 'Soft') return 0.35;
    if(level === 'Medium') return 0.68;
    return 1.0;
  }

  function stopNotificationBufferSource(){
    if(notificationBufferSource){
      try { notificationBufferSource.stop(0); } catch(_){}
      try { notificationBufferSource.disconnect(); } catch(_){}
      notificationBufferSource = null;
    }
    if(notificationBufferGain){
      try { notificationBufferGain.disconnect(); } catch(_){}
      notificationBufferGain = null;
    }
  }

  function startNotificationBufferFallbackLoop(vol){
    ensureAudioCtx();
    if(!audioCtx) return false;
    stopNotificationBufferSource();
    if(notificationAudioBuffer){
      try {
        const src = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        src.buffer = notificationAudioBuffer;
        src.loop = true;
        gain.gain.value = vol;
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start(0);
        notificationBufferSource = src;
        notificationBufferGain = gain;
        return true;
      } catch(_){}
    }
    return false;
  }

  function startNotificationSoundLoop(soundLevel){
    const level = soundLevel || (typeof reminderSoundValue !== 'undefined' ? reminderSoundValue : 'Strong');
    clearTimeout(notificationPreviewTimeout);
    notificationPreviewTimeout = null;
    if(level === 'Silent'){
      stopNotificationSoundLoop();
      return;
    }
    const vol = getVolumeForSoundLevel(level);
    isNotificationSoundLooping = true;

    try {
      if(navigator.vibrate){
        navigator.vibrate(level === 'Strong' ? [220, 100, 220, 100, 300] : [160, 80, 160]);
      }
    } catch(_){}

    ensureAudioCtx();
    preloadNotificationAudioBuffer();
    stopNotificationBufferSource();
    clearInterval(beepIntervalId);
    beepIntervalId = null;

    const el = ensureNotificationAudioElement();
    if(el){
      try {
        el.loop = true;
        el.volume = vol;
        if(el.paused){
          el.currentTime = 0;
        }
        const playPromise = el.play();
        if(playPromise && typeof playPromise.catch === 'function'){
          playPromise.catch(() => {
            if(!isNotificationSoundLooping) return;
            if(!startNotificationBufferFallbackLoop(vol)){
              beepOnce();
              clearInterval(beepIntervalId);
              beepIntervalId = setInterval(beepOnce, 1200);
            }
          });
        }
        return;
      } catch(_){}
    }

    if(!startNotificationBufferFallbackLoop(vol)){
      beepOnce();
      clearInterval(beepIntervalId);
      beepIntervalId = setInterval(beepOnce, 1200);
    }
  }

  function stopNotificationSoundLoop(){
    isNotificationSoundLooping = false;
    clearTimeout(notificationPreviewTimeout);
    notificationPreviewTimeout = null;
    clearInterval(beepIntervalId);
    beepIntervalId = null;
    stopNotificationBufferSource();
    if(notificationAudioEl){
      try {
        notificationAudioEl.pause();
        notificationAudioEl.currentTime = 0;
      } catch(_){}
    }
  }

  function beepOnce(){
    if(!audioCtx) return;
    try{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.value = 0.18;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.28);
    }catch(e){ /* ignore */ }
  }
  function startBeeping(){
    startNotificationSoundLoop('Strong');
  }
  function stopBeeping(){
    stopNotificationSoundLoop();
  }

  // ---------- 6pm reminder: scheduling (5m repeat -> 5m break -> 5m repeat -> stop) ----------
  let reminderModalOpen = false;
  let reminderRingTimer = null;

  function getRemainingHabitsToday(){
    const today = new Date();
    return data.habits.filter(h => effectiveStatus(h.id, today) === 'pending');
  }

  function checkReminder(){
    if(!data || !data.notifyEnabled) return;
    const today = dateKey(new Date());
    if(!data.reminder || data.reminder.date !== today){
      data.reminder = { date: today, attempt: 0, firstAttemptAt: null, firstAttemptEndedAt: null, done: false };
      scheduleSave();
    }
    const r = data.reminder;
    if(r.done || reminderModalOpen) return;
    const now = new Date();
    if(r.attempt === 0){
      if(now.getHours() === 18 && now.getMinutes() === 0){
        triggerReminderAttempt(1);
      }
    } else if(r.attempt === 1){
      const breakRef = r.firstAttemptEndedAt || (r.firstAttemptAt ? r.firstAttemptAt + NOTIFICATION_RING_DURATION_MS : null);
      if(breakRef && Date.now() - breakRef >= NOTIFICATION_BREAK_DURATION_MS){
        triggerReminderAttempt(2);
      }
    }
  }

  function triggerReminderAttempt(attemptNum){
    const remaining = getRemainingHabitsToday();
    if(remaining.length === 0){
      data.reminder.done = true;
      scheduleSave();
      return;
    }
    data.reminder.attempt = attemptNum;
    if(attemptNum === 1) data.reminder.firstAttemptAt = Date.now();
    scheduleSave();

    reminderModalOpen = true;
    renderReminderModal(remaining);
    startBeeping();
    if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
      try{ new Notification('KeepIt', { body: `${remaining.length} habit${remaining.length===1?'':'s'} left today` }); }catch(e){}
    }
    clearTimeout(reminderRingTimer);
    reminderRingTimer = setTimeout(() => {
      stopBeeping();
      closeReminderModal();
      reminderModalOpen = false;
      if(attemptNum === 1 && data && data.reminder){
        data.reminder.firstAttemptEndedAt = Date.now();
        scheduleSave();
      } else if(attemptNum >= 2 && data && data.reminder){
        data.reminder.done = true;
        scheduleSave();
      }
      // If attemptNum === 1, checkReminder() waits 5 minutes of break and then fires attempt 2 for another 5 minutes
    }, NOTIFICATION_RING_DURATION_MS);
  }

  function resolveReminder(action){
    clearTimeout(reminderRingTimer);
    stopBeeping();
    closeReminderModal();
    reminderModalOpen = false;
    data.reminder.done = true;
    scheduleSave();
    if(action === 'do'){
      page = 'tracker';
      renderPage();
    }
  }

  const NAV_ITEMS = [
    { id:'tracker', label:'Tracker', icon: NAV_ICONS.tracker },
    { id:'reminder', label:'Reminder', icon: NAV_ICONS.reminder },
    { id:'report', label:'Report', icon: NAV_ICONS.report },
    { id:'settings', label:'Settings', icon: NAV_ICONS.settings }
  ];
  function renderTopNav(){
    const el = document.getElementById('topNav');
    if(!el) return;
    el.style.display = '';
    el.innerHTML = `
      <div class="tn-brand"><img src="${LOGO_SRC}" alt="KeepIt"><span>KeepIt</span></div>
      <nav class="tn-links">${NAV_ITEMS.map(i => `<button data-section="${i.id}" class="${section===i.id?'active':''}">${i.label}</button>`).join('')}</nav>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="tn-plan-pill ${getEffectivePlan()}" id="topPlanBtn" title="Subscription Plan">${getPlanBadgeHtml()}</button>
        ${isCurrentUserAdmin() ? '<button class="tn-admin-btn" id="topAdminBtn" title="Admin Portal">Admin</button>' : ''}
        <button class="tn-cta" id="topLogoutBtn">Log out <span aria-hidden="true">\u2192</span></button>
      </div>`;
  }
  function renderBottomNav(){
    renderTopNav();
    const el = document.getElementById('bottomNav');
    if(!el) return;
    el.innerHTML = NAV_ITEMS.map(item => `
      <button data-section="${item.id}" class="${section===item.id?'active':''}">
        <span class="bn-icon">${item.icon}</span>
        <span>${item.label}</span>
      </button>
    `).join('');
  }


  // ---------- side cards ----------
  function renderSideCard(containerId, listKey, title){
    const el = document.getElementById(containerId);
    if(!el) return;
    const items = data[listKey];
    let html = `<h3>${title}</h3>`;
    items.forEach((val, i) => {
      html += `
        <div class="line-row">
          <span class="num">${i+1}.</span>
          <input type="text" data-list="${listKey}" data-idx="${i}" value="${escapeAttr(val)}" placeholder="Type here...">
          <button class="rm" data-remove="${listKey}" data-idx="${i}" title="Remove">\u2715</button>
        </div>`;
    });
    if(items.length < 8){
      html += `<button class="add-line" data-addline="${listKey}">+ add line</button>`;
    }
    el.innerHTML = html;
  }

  function renderTitleBlock(){
    const el = document.getElementById('titleBlock');
    if(!el) return;
    let navHtml, pillLabel;
    if(viewMode === 'monthly'){
      pillLabel = `${MONTH_NAMES[monthCursor.getMonth()]} ${monthCursor.getFullYear()}`;
      navHtml = `<button data-nav="prevMonth">&#8249;</button><span class="month-pill">Month: ${pillLabel}</span><button data-nav="nextMonth">&#8250;</button>`;
    } else {
      const dates = getWeekDates(weekCursor);
      const first = dates[0], last = dates[6];
      const sameMonth = first.getMonth() === last.getMonth();
      pillLabel = sameMonth
        ? `${MONTH_NAMES[first.getMonth()]} ${first.getDate()}\u2013${last.getDate()}`
        : `${MONTH_NAMES[first.getMonth()].slice(0,3)} ${first.getDate()} \u2013 ${MONTH_NAMES[last.getMonth()].slice(0,3)} ${last.getDate()}`;
      navHtml = `<button data-nav="prevWeek">&#8249;</button><span class="month-pill">Week: ${pillLabel}</span><button data-nav="nextWeek">&#8250;</button>`;
    }
    el.innerHTML = `<h1>KeepIt</h1><div class="month-nav">${navHtml}</div><p class="tagline">Build Habits. Keep Promises.</p>`;
  }

  function renderControlsBar(){
    const el = document.getElementById('controlsBar');
    if(!el) return;
    const s = computeStreaks();
    el.innerHTML = `
      <div class="view-toggle">
        <button data-view="monthly" class="${viewMode==='monthly'?'active':''}">Monthly</button>
        <button data-view="weekly" class="${viewMode==='weekly'?'active':''}">Weekly</button>
      </div>
      <div class="streak-wrap">
        <div class="streak-badge flame">\ud83d\udd25 <b>${s.current}</b> day streak</div>
        <div class="streak-badge">\ud83c\udfc6 Best: <b>${s.best}</b></div>
      </div>
      <div class="report-btns">
        <button data-report="weekly">Weekly report</button>
        <button data-report="monthly">Monthly report</button>
      </div>
    `;
  }

  function renderGrid(){
    const el = document.getElementById('gridWrapper');
    if(!el) return;
    const dates = viewMode === 'monthly'
      ? getMonthDates(monthCursor.getFullYear(), monthCursor.getMonth())
      : getWeekDates(weekCursor);
    const colTemplate = `170px repeat(${dates.length}, ${viewMode==='monthly' ? '30px' : '42px'})`;

    let headerCells = `<div class="habit-name-header">Habit</div>`;
    dates.forEach(d => {
      headerCells += viewMode === 'monthly'
        ? `<div class="day-header">${d.getDate()}</div>`
        : `<div class="day-header">${d.getDate()}<span class="wd">${WD_SHORT[d.getDay()]}</span></div>`;
    });

    let rowsHtml = '';
    if(data.habits.length === 0){
      rowsHtml = `<div class="empty-note">No habits yet — add your first one below.</div>`;
    } else {
      data.habits.forEach(h => {
        let cells = `
          <div class="habit-name-cell">
            <span class="habit-emoji">${h.emoji || DEFAULT_EMOJI}</span>
            <input type="text" data-habit-name="${h.id}" value="${escapeAttr(h.name)}" placeholder="Habit name">
            <button class="habit-del" data-del-habit="${h.id}" title="Delete habit">\u2715</button>
          </div>`;
        dates.forEach(d => {
          const eff = effectiveStatus(h.id, d);
          const glyph = eff === 'done' ? '\u2713' : (eff === 'missed' ? '\u2715' : '');
          cells += `<div class="day-cell"><div class="cell ${eff}" data-habit="${h.id}" data-date="${dateKey(d)}">${glyph}</div></div>`;
        });
        rowsHtml += `<div class="habit-row" style="grid-template-columns:${colTemplate}">${cells}</div>`;
      });
    }

    el.innerHTML = `
      <div class="grid-header-row" style="grid-template-columns:${colTemplate}">${headerCells}</div>
      ${rowsHtml}
      <div class="add-habit-row">
        <input type="text" id="newHabitInput" placeholder="New habit name...">
        <button id="addHabitBtn">+ Add habit</button>
      </div>
      ${getEffectivePlan() === 'free' ? `
        <div class="limit-badge-info">
          <span>Free Plan: <b>${data.habits.length}/5</b> habits used.</span>
          <a id="gridUpgradeLink">Upgrade to Pro for unlimited habits &rarr;</a>
        </div>
      ` : ''}
    `;
  }

  // ---------- reports ----------
  function buildReportStats(dates){
    const today = startOfDay(new Date());
    const elapsed = dates.filter(d => startOfDay(d).getTime() <= today.getTime());
    let totalDone = 0, totalPossible = 0, qualifyingDays = 0;
    const perHabit = data.habits.map(h => ({ id:h.id, name:h.name, emoji:h.emoji, done:0 }));
    elapsed.forEach(d => {
      const pct = dayCompletionPct(d);
      if(pct !== null && pct >= 70) qualifyingDays++;
      data.habits.forEach((h, i) => {
        if(effectiveStatus(h.id, d) === 'done'){ perHabit[i].done++; totalDone++; }
        totalPossible++;
      });
    });
    const overallPct = totalPossible ? Math.round((totalDone/totalPossible)*100) : 0;
    perHabit.sort((a,b) => b.done - a.done);
    return { elapsedDates: elapsed, elapsedDays: elapsed.length, overallPct, qualifyingDays, perHabit, totalDone, totalPossible };
  }

  function buildLineChartSVG(elapsedDates, mode){
    if(elapsedDates.length === 0){
      return `<div class="empty-note">Not enough data yet for this period.</div>`;
    }
    const points = elapsedDates.map(d => ({ date: d, pct: dayCompletionPct(d) || 0 }));
    const W = 640, H = 240, padL = 42, padR = 18, padT = 18, padB = 36;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const n = points.length;
    const xFor = i => n === 1 ? padL + plotW/2 : padL + (i * (plotW/(n-1)));
    const yFor = v => padT + plotH - (Math.max(0,Math.min(100,v))/100)*plotH;
    const baseY = padT + plotH;

    // axis lines (no gridlines, just left + bottom rules, like the reference chart)
    let axes = `
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${baseY}" style="stroke:var(--axis-line);stroke-width:1.2" />
      <line x1="${padL}" y1="${baseY.toFixed(1)}" x2="${W-padR}" y2="${baseY.toFixed(1)}" style="stroke:var(--axis-line);stroke-width:1.2" />`;
    [0,25,50,75,100].forEach(v => {
      const y = yFor(v);
      axes += `<text x="${padL-10}" y="${(y+3.5).toFixed(1)}" text-anchor="end" style="font-size:11px;fill:var(--ink-soft);font-family:var(--sans)">${v}</text>`;
    });
    // subtle 70% streak-goal reference line
    const y70 = yFor(70);
    axes += `<line x1="${padL}" y1="${y70.toFixed(1)}" x2="${W-padR}" y2="${y70.toFixed(1)}" style="stroke:var(--flame);stroke-width:1;stroke-dasharray:3,4;opacity:0.5" />`;

    let path = '';
    points.forEach((p,i) => {
      const x = xFor(i), y = yFor(p.pct);
      path += (i===0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    });

    let dots = '', labels = '';
    const labelEvery = mode === 'month' ? Math.max(1, Math.ceil(n/8)) : 1;
    points.forEach((p,i) => {
      const x = xFor(i), y = yFor(p.pct);
      const dotColor = p.pct >= 70 ? 'var(--green)' : 'var(--red)';
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" style="fill:${dotColor};stroke:var(--card-bg);stroke-width:2.5" />`;
      if(i % labelEvery === 0 || i === n-1){
        const lbl = mode === 'week' ? WD_SHORT[p.date.getDay()] : String(p.date.getDate());
        labels += `<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" style="font-size:12px;fill:var(--ink-soft);font-family:var(--sans)">${lbl}</text>`;
      }
    });

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
      ${axes}
      <path d="${path.trim()}" style="fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round" />
      ${dots}
      ${labels}
    </svg>`;
  }

  // Format a Date object into "h:mm am/pm"
  function formatTime12hFromDate(dt){
    let h = dt.getHours();
    const m = dt.getMinutes();
    const ap = h >= 12 ? 'pm' : 'am';
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2, '0')} ${ap}`;
  }

  // Convert relative time presets like "1 hour from now" or "15 mins from now" into actual time label
  function resolvePresetTimeLabel(presetStr){
    const s = (presetStr || '').trim().toLowerCase();
    const relMatch = s.match(/^(\d+)\s*(min|mins|minute|minutes|hr|hrs|hour|hours)\s+from\s+now$/i);
    if(relMatch){
      const amt = Number(relMatch[1]) || 1;
      const unit = relMatch[2].toLowerCase();
      const offsetMs = unit.startsWith('h') ? amt * 3600000 : amt * 60000;
      const target = new Date(Date.now() + offsetMs);
      const now = new Date();
      if(target.getDate() !== now.getDate() || target.getMonth() !== now.getMonth()){
        reminderSelectedDateLabel = 'Tomorrow';
      }
      reminderPickerHour = target.getHours() % 12 || 12;
      reminderPickerMinute = target.getMinutes();
      reminderPickerAmPm = target.getHours() >= 12 ? 'pm' : 'am';
      return formatTime12hFromDate(target);
    }
    return presetStr;
  }

  // Parse a reminder's date/time label and early alert label into exact epoch ms timestamps
  function computeReminderScheduleTimestamps(dateChipStr, earlyAlertStr){
    if(!dateChipStr) return { alertAt: null, earlyAlertAt: null };
    const now = new Date();
    let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 9, 0, 0, 0);

    const raw = String(dateChipStr).trim();
    // Check if there is a time suffix like ", 3:00 pm"
    const timeRegex = /(\d{1,2}):(\d{2})\s*(am|pm)/i;
    const timeMatch = raw.match(timeRegex);
    let datePart = raw;
    if(timeMatch){
      datePart = raw.replace(timeMatch[0], '').replace(/,\s*$/, '').trim();
    }

    const dLower = datePart.toLowerCase();
    const shortMonths = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

    if(!dLower || dLower === 'today'){
      targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    } else if(dLower === 'tomorrow'){
      targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    } else {
      const relDateMatch = dLower.match(/^(\d+)\s*(day|days|week|weeks|month|months)\s+from\s+now$/i);
      if(relDateMatch){
        const n = Number(relDateMatch[1]) || 1;
        const u = relDateMatch[2].toLowerCase();
        targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        if(u.startsWith('day')) targetDate.setDate(targetDate.getDate() + n);
        else if(u.startsWith('week')) targetDate.setDate(targetDate.getDate() + n * 7);
        else if(u.startsWith('month')) targetDate.setMonth(targetDate.getMonth() + n);
      } else {
        // Check formats like "Sat, 18 Oct 2026" or "23 Oct"
        const dmY = dLower.match(/(\d{1,2})\s+([a-z]{3,9})(?:\s+(\d{4}))?/i);
        if(dmY){
          const dayNum = Number(dmY[1]);
          const monPrefix = dmY[2].slice(0, 3).toLowerCase();
          const monIdx = shortMonths.indexOf(monPrefix);
          const yrNum = dmY[3] ? Number(dmY[3]) : now.getFullYear();
          if(monIdx !== -1){
            targetDate = new Date(yrNum, monIdx, dayNum);
          }
        }
      }
    }

    if(timeMatch){
      let hr = Number(timeMatch[1]);
      const mn = Number(timeMatch[2]);
      const ap = timeMatch[3].toLowerCase();
      if(ap === 'pm' && hr < 12) hr += 12;
      if(ap === 'am' && hr === 12) hr = 0;
      targetDate.setHours(hr, mn, 0, 0);
    } else {
      // All-day reminder: trigger at 9:00 AM (or 1 min from now if set for Today after 9 AM)
      targetDate.setHours(9, 0, 0, 0);
      if(dLower === 'today' && targetDate.getTime() < Date.now()){
        targetDate = new Date(Date.now() + 60000);
      }
    }

    const alertAt = targetDate.getTime();
    let earlyAlertAt = null;
    if(earlyAlertStr && earlyAlertStr !== 'No early alert'){
      const em = String(earlyAlertStr).toLowerCase().match(/(\d+)\s*(min|mins|minute|minutes|hour|hours|day|days)\s+before/);
      if(em){
        const val = Number(em[1]) || 0;
        const unit = em[2];
        let offsetMs = 0;
        if(unit.startsWith('min')) offsetMs = val * 60000;
        else if(unit.startsWith('hour')) offsetMs = val * 3600000;
        else if(unit.startsWith('day')) offsetMs = val * 86400000;
        if(offsetMs > 0) earlyAlertAt = alertAt - offsetMs;
      }
    }
    return { alertAt, earlyAlertAt };
  }

  function computeNextRepeatTimestamp(baseTs, repeatStr){
    if(!repeatStr || repeatStr === "Don't repeat") return null;
    const base = new Date(Math.max(baseTs || Date.now(), Date.now()));
    const s = repeatStr.toLowerCase().trim();
    if(s === 'every day'){ base.setDate(base.getDate() + 1); return base.getTime(); }
    if(s === 'every week'){ base.setDate(base.getDate() + 7); return base.getTime(); }
    if(s === 'every month'){ base.setMonth(base.getMonth() + 1); return base.getTime(); }
    if(s === 'every year'){ base.setFullYear(base.getFullYear() + 1); return base.getTime(); }
    const m = s.match(/every\s+(\d+)?\s*(minute|minutes|hour|hours|day|days|week|weeks|month|months|year|years)/i);
    if(m){
      const cnt = Number(m[1]) || 1;
      const unit = m[2].toLowerCase();
      if(unit.startsWith('minute')) return base.getTime() + cnt * 60000;
      if(unit.startsWith('hour')) return base.getTime() + cnt * 3600000;
      if(unit.startsWith('day')){ base.setDate(base.getDate() + cnt); return base.getTime(); }
      if(unit.startsWith('week')){ base.setDate(base.getDate() + cnt * 7); return base.getTime(); }
      if(unit.startsWith('month')){ base.setMonth(base.getMonth() + cnt); return base.getTime(); }
      if(unit.startsWith('year')){ base.setFullYear(base.getFullYear() + cnt); return base.getTime(); }
    }
    return null;
  }

        navigator.serviceWorker.controller.postMessage({
          type: 'CLOSE_REMINDER_NOTIFICATION',
          reminderId: reminderId || null
        });
      }
    } catch(_){}
  }

  function stopReminderAlertCycle(matchingId){
    if(matchingId && activeDueReminderAlert && activeDueReminderAlert.id !== matchingId){
      return;
    }
    const targetId = activeDueReminderAlert ? activeDueReminderAlert.id : matchingId;
    clearReminderCycleTimers();
    stopNotificationSoundLoop();
    closeActiveNativeNotifications(targetId);
    if(activeDueReminderAlert && (!matchingId || activeDueReminderAlert.id === matchingId)){
      activeDueReminderAlert = null;
      renderLiveDueReminderBanner();
    }
  }

  // Play a short preview of seven_am_sunlight.mp4 when selecting sound strength in Add Reminder sheet
  function playReminderChime(soundLevel){
    const level = soundLevel || reminderSoundValue || 'Strong';
    if(level === 'Silent'){
      if(!activeDueReminderAlert) stopNotificationSoundLoop();
      return;
    }
    // If an active reminder alert cycle is currently ringing, keep it looping at the selected level
    if(activeDueReminderAlert && activeDueReminderAlert._cyclePhase !== 'break'){
      startNotificationSoundLoop(level);
      return;
    }
    startNotificationSoundLoop(level);
    clearTimeout(notificationPreviewTimeout);
    notificationPreviewTimeout = setTimeout(() => {
      if(!activeDueReminderAlert){
        stopNotificationSoundLoop();
      }
    }, 4500);
  }

  // Start the 5-minute repeat -> 5-minute break -> 5-minute repeat -> auto-stop notification cycle
  function startReminderAlertCycle(item, isEarly){
    if(!item) return;
    clearReminderCycleTimers();
    stopNotificationSoundLoop();

    const soundLevel = item.sound || (isEarly ? 'Medium' : 'Strong');
    const alertCopy = Object.assign({}, item, {
      _isEarlyAlertBanner: Boolean(isEarly),
      _cyclePhase: 'ringing-1'
    });
    activeDueReminderAlert = alertCopy;
    renderLiveDueReminderBanner();
    startNotificationSoundLoop(soundLevel);
    triggerNativeReminderNotification(item, isEarly);

    // 1. After 5 minutes of continuous repeat: pause for a 5-minute break if user hasn't completed or dismissed
    reminderCycleBreakTimer = setTimeout(() => {
      if(!activeDueReminderAlert || activeDueReminderAlert.id !== item.id) return;
      stopNotificationSoundLoop();
      activeDueReminderAlert._cyclePhase = 'break';
      renderLiveDueReminderBanner();

      // 2. After 5 minutes of break: resume playing seven_am_sunlight.mp4 on repeat for another 5 minutes
      reminderCycleResumeTimer = setTimeout(() => {
        if(!activeDueReminderAlert || activeDueReminderAlert.id !== item.id) return;
        // Verify reminder wasn't completed or deleted in the meantime
        const isTest = String(item.id).startsWith('test-');
        const stillPending = isTest || reminderItems.some(r => r.id === item.id && !r.completed);
        if(!stillPending){
          stopReminderAlertCycle(item.id);
          return;
        }
        activeDueReminderAlert._cyclePhase = 'ringing-2';
        renderLiveDueReminderBanner();
        startNotificationSoundLoop(soundLevel);
        triggerNativeReminderNotification(item, isEarly);

        // 3. After the second 5-minute repeat window: if user still hasn't replied, stop notification & sound
        reminderCycleFinalStopTimer = setTimeout(() => {
          if(!activeDueReminderAlert || activeDueReminderAlert.id !== item.id) return;
          stopReminderAlertCycle(item.id);
        }, NOTIFICATION_RING_DURATION_MS);
      }, NOTIFICATION_BREAK_DURATION_MS);
    }, NOTIFICATION_RING_DURATION_MS);
  }

  function syncRemindersToServiceWorker(){
    try {
      if('serviceWorker' in navigator && navigator.serviceWorker.controller){
        navigator.serviceWorker.controller.postMessage({
          type: 'SYNC_REMINDERS',
          reminders: reminderItems
        });
      } else if(swRegistrationRef && swRegistrationRef.active){
        swRegistrationRef.active.postMessage({
          type: 'SYNC_REMINDERS',
          reminders: reminderItems
        });
      }
    } catch(_){}
  }

  async function triggerNativeReminderNotification(item, isEarly){
    if(!reminderNotificationsEnabled) return;
    const title = isEarly ? `Upcoming: ${item.title}` : (item.title || 'KeepIt Reminder');
    const subList = item.checklist && item.checklist.length
      ? ' • ' + item.checklist.map(c => c.text || c).join(', ')
      : '';
    const body = isEarly
      ? `${item.earlyAlert || 'Early alert'} (${item.date || 'Scheduled'})${subList}`
      : `${item.date || 'Due now'}${subList}`;
    const tag = `${item.id}:${isEarly ? 'early' : 'main'}:${isEarly ? item.earlyAlertAt : item.alertAt}`;

    if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;

    try {
      if(swRegistrationRef && swRegistrationRef.showNotification){
        await swRegistrationRef.showNotification(title, {
          body,
          icon: './icon.svg',
          badge: './icon.svg',
          tag,
          renotify: true,
          requireInteraction: true,
          vibrate: [220, 100, 220, 100, 300],
          data: { reminderId: item.id, url: './#reminder' },
          actions: [
            { action: 'complete', title: '✓ Complete' },
            { action: 'dismiss', title: '✕ Dismiss' }
          ]
        });
        return;
      }
    } catch(_){}

    try {
      if(activeNativeNotificationObj){
        try { activeNativeNotificationObj.close(); } catch(_){}
      }
      const n = new Notification(title, {
        body,
        icon: './icon.svg',
        tag,
        requireInteraction: true
      });
      activeNativeNotificationObj = n;
      n.onclick = () => {
        window.focus();
        section = 'reminder';
        renderBottomNav();
        renderPage();
        n.close();
      };
    } catch(_){}
  }

  function handleReminderAlertAction(action, reminderId){
    // Stop the repeating notification sound & 5m/5m/5m cycle immediately when user replies (complete, dismiss, or snooze)
    stopReminderAlertCycle(reminderId);

    const idx = reminderItems.findIndex(i => i.id === reminderId);
    if(action === 'complete' && idx !== -1){
      const item = reminderItems[idx];
      const nextTs = computeNextRepeatTimestamp(item.alertAt, item.repeat);
      if(nextTs){
        item.alertAt = nextTs;
        const dt = new Date(nextTs);
        const shortDays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const shortMonths = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
        item.date = `${shortDays[dt.getDay()]}, ${dt.getDate()} ${shortMonths[dt.getMonth()]} ${dt.getFullYear()}, ${formatTime12hFromDate(dt)}`;
        item.notifiedMain = false;
        item.notifiedEarly = false;
        showToast('Completed! Next repeat scheduled: ' + item.date);
      } else {
        const [removed] = reminderItems.splice(idx, 1);
        completedReminderItems.unshift({
          id: 'c-' + Date.now() + '-' + removed.id,
          month: 'Oct',
          title: removed.title,
          declined: null,
          date: removed.date || 'Today',
          completedAt: 'Completed: Just now',
          contact: null,
          important: removed.important,
          checklist: removed.checklist || []
        });
        showToast('Reminder completed');
      }
      saveReminderState();
    } else if(action === 'snooze' && idx !== -1){
      const item = reminderItems[idx];
      const snoozeUntil = Date.now() + 5 * 60000;
      item.alertAt = snoozeUntil;
      item.notifiedMain = false;
      item.date = `Today, ${formatTime12hFromDate(new Date(snoozeUntil))}`;
      saveReminderState();
      showToast('Snoozed for 5 minutes');
    } else if(action === 'dismiss'){
      showToast('Reminder notification dismissed');
    }
    if(section === 'reminder') renderReminderSection();
  }

  function checkDueUserReminders(){
    const now = Date.now();
    let changed = false;
    for(const item of reminderItems){
      if(!item || item.completed) continue;
      // Backfill timestamps for any reminder that has a date string but no alertAt yet
      if(item.date && !item.alertAt && item.section !== 'No alert'){
        const computed = computeReminderScheduleTimestamps(item.date, item.earlyAlert);
        item.alertAt = computed.alertAt;
        item.earlyAlertAt = computed.earlyAlertAt;
        changed = true;
      }

      // 1. Check Early Alert
      if(item.earlyAlertAt && !item.notifiedEarly && now >= item.earlyAlertAt){
        item.notifiedEarly = true;
        changed = true;
        startReminderAlertCycle(item, true);
      }

      // 2. Check Main Due Alert
      if(item.alertAt && !item.notifiedMain && now >= item.alertAt){
        item.notifiedMain = true;
        changed = true;
        startReminderAlertCycle(item, false);
      }
    }
    if(changed){
      saveReminderState();
      if(section === 'reminder') renderReminderSection();
    }
  }

  async function requestKeepItNotificationPermission(runTestAfter){
    ensureAudioCtx();
    ensureNotificationAudioElement();
    preloadNotificationAudioBuffer();
    if(typeof Notification === 'undefined'){
      showToast('System notifications require a supported browser or Home Screen app');
      if(runTestAfter && isCurrentUserAdmin()){
        startReminderAlertCycle({
          id: 'test-' + Date.now(),
          title: 'KeepIt Test Reminder Alert!',
          date: 'Today, ' + formatTime12hFromDate(new Date()),
          sound: 'Strong',
          checklist: [{ text: 'Notification sound & live alert banner working!', done: false }]
        }, false);
      }
      return;
    }
    try {
      const perm = await Notification.requestPermission();
      if(perm === 'granted'){
        reminderNotificationsEnabled = true;
        localStorage.setItem('keepit_rm_notify_enabled_v1', 'true');
        data.notifyEnabled = true;
        scheduleSave();
        if(runTestAfter && isCurrentUserAdmin()){
          startReminderAlertCycle({
            id: 'test-notif-' + Date.now(),
            title: 'KeepIt Test Reminder',
            date: 'Today, ' + formatTime12hFromDate(new Date()),
            sound: 'Strong',

  function applyReminderSort(){
    const dir = reminderSortOrder === 'asc' ? 1 : -1;
    reminderItems.sort((a, b) => {
      if(reminderSortBy === 'title'){
        return (a.title || '').localeCompare(b.title || '') * dir;
      }
      if(reminderSortBy === 'category'){
        return (a.category || '').localeCompare(b.category || '') * dir;
      }
      if(reminderSortBy === 'dateModified'){
        return ((a.modifiedAt || 0) - (b.modifiedAt || 0)) * dir;
      }
      // Default: 'alertTime'
      const da = a.alertAt || 9999999999999;
      const db = b.alertAt || 9999999999999;
      return (da - db) * dir;
    });
    saveReminderState();
  }

  function getReminderCounts(){
    const todayCount = reminderItems.filter(i => !i.completed && (i.category === 'today' || (i.date && i.date.startsWith('Today')))).length;

    const impCount = reminderItems.filter(i => !i.completed && i.important).length;
    const placeCount = reminderItems.filter(i => !i.completed && i.category === 'place').length;
    const noAlertCount = reminderItems.filter(i => !i.completed && i.category === 'noAlert').length;
    return {
      today: todayCount,
      scheduled: schedCount,
      important: impCount,
      place: placeCount,
      noAlert: noAlertCount,
      completed: completedReminderItems.length
    };
  }

  function renderMainCardsListInnerHtml(){
    let filtered = reminderItems;

      filtered = reminderItems.filter(i => i.title.toLowerCase().includes(q));
    }
    const mainCards = filtered.filter(i => i.section === 'main');
    const pastCards = filtered.filter(i => i.section === 'Past');
    const noAlertCards = filtered.filter(i => i.section === 'No alert');

    if(!filtered.length){

    return `

      ` : ''}

  function renderReminderSection(){
    const root = document.getElementById('pageRoot');
    if(!root) return;

    if(reminderCurrentView === 'today'){
      renderReminderTodayView(root);
      return;
    }
    if(reminderCurrentView === 'important'){
      renderReminderImportantView(root);
      return;
    }
    if(reminderCurrentView === 'completed'){
      renderReminderCompletedView(root);
      return;
    }
    if(reminderCurrentView === 'scheduled'){
      renderReminderFilteredView(root, 'Scheduled', item => item.category === 'scheduled' || item.date);
      return;
    }
    if(reminderCurrentView === 'place'){
      renderReminderFilteredView(root, 'Place', item => item.category === 'place');
      return;
    }
    if(reminderCurrentView === 'noAlert'){
      renderReminderFilteredView(root, 'No alert', item => item.category === 'noAlert');
      return;
    }

    renderReminderMainView(root);
  }

    return `

                ★
              </button>
            </div>
            ${item.date ? `<div class="rm-card-date">${escapeAttr(item.date)}</div>` : ''}

            ${item.checklist && item.checklist.length ? `
              <ul class="rm-checklist">

        </div>
      </div>

      return `
