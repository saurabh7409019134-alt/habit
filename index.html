  async function handleGoogleAuth(mode){
    mode = mode || 'login';
    const btn = document.getElementById(mode === 'signup' ? 'googleSignupBtn' : 'googleLoginBtn');
    if(btn){
      btn.disabled = true;
      btn.innerHTML = `${GOOGLE_LOGO_SVG}<span>Connecting to Google...</span>`;
    }

    if(sb){
      try {
        // Check if Google OAuth provider is enabled on the Supabase project before redirecting
        let googleProviderEnabled = false;
        try {
          const settingsRes = await fetch(`${SUPABASE_URL}/auth/v1/settings`, {
            headers: { apikey: SUPABASE_ANON_KEY }
          });
          if(settingsRes.ok){
            const settingsJson = await settingsRes.json();
            if(settingsJson && settingsJson.external && settingsJson.external.google === true){
              googleProviderEnabled = true;
            }
          }
        } catch(checkErr){}

        if(googleProviderEnabled){
          const redirectUrl = window.location.origin + window.location.pathname;
          const { data, error } = await sb.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: redirectUrl,
              queryParams: {
                access_type: 'offline',
                prompt: 'select_account'
              }
            }
          });
          if(!error && data && data.url){
            window.location.href = data.url;
            return;
          }
        }
      } catch(err){
        console.warn('Google OAuth check notice:', err);
      }
    }

    // Re-enable button and open interactive Google Account Chooser modal
    if(btn){
      btn.disabled = false;
      btn.innerHTML = `${GOOGLE_LOGO_SVG}<span>${mode === 'signup' ? 'Sign up with Google' : 'Sign in with Google'}</span>`;
    }
    openGoogleAccountChooserModal(mode);
  }

  (async function init(){
    if(/type=recovery/.test(location.hash)){
      renderLoginScreen('', 'reset');
      return;
    }
    const isGuestRequest = location.search.includes('guest') || location.search.includes('preview') || location.search.includes('demo') || location.hash === '#guest' || location.hash === '#reminder' || location.hash === '#preview';
    if(isGuestRequest){
      currentUserId = 'guest_demo';
      currentUserEmail = 'demo@keepit.app';
      setSavedCurrentUser({ id: currentUserId, email: currentUserEmail, isLocalOnly: true });
      if(location.hash === '#reminder' || location.search.includes('reminder')) section = 'reminder';
      document.getElementById('app').style.display = '';
      await startApp();
      return;
    }
    // 1. Check Supabase session with safe timeout
    if(sb){
      try {
        const sessionPromise = sb.auth.getSession();
        const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1500));
        const { data: sessionData } = await Promise.race([sessionPromise, timeoutPromise]);
        if(sessionData && sessionData.session && sessionData.session.user){
          currentUserId = sessionData.session.user.id;
          currentUserEmail = sessionData.session.user.email || null;
          setSavedCurrentUser({ id: currentUserId, email: currentUserEmail, isLocalOnly: false });
          if(currentUserEmail){
            saveLocalUser(currentUserEmail, '', currentUserId);
            try {
              await sb.from('admin_user_profiles').upsert({
                email: currentUserEmail.toLowerCase(),
                updated_at: new Date().toISOString()
              }, { onConflict: 'email' });
            } catch(e){}
          }
          if(location.hash && location.hash.includes('access_token=')){
            try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch(e){}
          }
          if(location.hash === '#reminder') section = 'reminder';
          document.getElementById('app').style.display = '';
          await startApp();
          return;
        }
      } catch(e){}
    }
    // 2. Check saved user in localStorage
    const savedUser = getSavedCurrentUser();
    if(savedUser && savedUser.id && savedUser.email){
      currentUserId = savedUser.id;
      currentUserEmail = savedUser.email;
      if(location.hash === '#reminder') section = 'reminder';
      document.getElementById('app').style.display = '';
      await startApp();
      return;
    }
    // 3. Show clean login screen
    renderLoginScreen('', 'login');

    if(sb){
      sb.auth.onAuthStateChange(async (event, session) => {
        if(event === 'PASSWORD_RECOVERY'){ renderLoginScreen('', 'reset'); return; }
        if(event === 'SIGNED_IN' && session && session.user && !currentUserId){
          currentUserId = session.user.id;
          currentUserEmail = session.user.email || null;
          setSavedCurrentUser({ id: currentUserId, email: currentUserEmail, isLocalOnly: false });
          if(currentUserEmail){
            saveLocalUser(currentUserEmail, '', currentUserId);
            try {
              await sb.from('admin_user_profiles').upsert({
                email: currentUserEmail.toLowerCase(),
                updated_at: new Date().toISOString()
              }, { onConflict: 'email' });
            } catch(e){}
          }
          closeGoogleAccountChooserModal();
          document.getElementById('loginRoot').innerHTML = '';
          document.getElementById('app').style.display = '';
          await startApp();
          return;
        }
        if(event === 'SIGNED_OUT'){
          currentUserId = null;
          currentUserEmail = null;
          setSavedCurrentUser(null);
          document.getElementById('app').style.display = 'none';
          renderLoginScreen('', 'login');
        }
      });
    }
  })();
})();
</script>
  <div id="pricingModalRoot"></div>
  <div id="adminModalRoot"></div>
</body>
</html>
